[project]
name = "aitradebot-v2"
version = "2.0.0-alpha"
description = "Professional event-driven algorithmic trading platform"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "pydantic>=2.11",
    "PyYAML>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
target-version = ["py314"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"